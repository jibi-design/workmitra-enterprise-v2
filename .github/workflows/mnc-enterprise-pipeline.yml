# MNC Enterprise Production Assurance Pipeline
name: mnc-enterprise-pipeline

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: mnc-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  K6_VUS_MAX: "50"
  WM_API_BASE: "http://127.0.0.1:3001"

jobs:
  quality-gates:
    name: Types / Lint / Unit / Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:types
      - run: npm run check:lint
      - run: npm run test:coverage
        # Hard blocker: coverage thresholds enforced in vitest config (lines/functions/branches/statements ≥ 90)

  e2e-matrix:
    name: Playwright Matrix (Chromium / Firefox / WebKit)
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Unit failover + UI scale
        run: |
          npm test -- src/tests/shiftRetryQueue.failover.test.ts
          npm test -- src/tests/shiftUiScale.verify.test.ts
      - name: E2E multi-browser (core circuits)
        run: npx playwright test --project=chromium --project=firefox --project=webkit --project=mobile-safari tests/e2e/availability-phase1.spec.ts tests/e2e/home-gaps.spec.ts

  cdp-performance:
    name: CDP FPS + Memory Hard Blockers
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: CDP benchmark (4x CPU + Slow 3G)
        run: npx playwright test --project=chromium tests/e2e/shift-cdp-benchmark.spec.ts

  security-and-chaos:
    name: OWASP Probes + k6 Chaos Smoke
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start API
        run: |
          npm run dev:api &
          npx --yes wait-on http://127.0.0.1:3001/v1/jobmitra/health
      - name: Rate-limit 429 probe
        run: node tests/security/rate-limit.probe.mjs
      - name: PII isolation probe
        run: node tests/security/pii-isolation.probe.mjs
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E52627
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: k6 chaos smoke (scaled VUs)
        run: k6 run tests/load/k6-shift-chaos.js
